[package]
name = "ricochet-core"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[dependencies]
bytes = "1.12.1"
dirs = "7.0.0"
futures-executor = "0.3.34"
idevice = { version = "=0.1.68", default-features = false, features = ["ring", "usbmuxd", "house_arrest", "afc"] }
mtp-rs = "=0.38.1"
plist = "1.10.3"
rusqlite = { version = "0.43.0", features = ["bundled"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "fs", "io-util"] }

[[bin]]
name = "ricochet-cli"
path = "src/bin/ricochet-cli.rs"
